schema_version: 1
scope:
  slug: "ashdod-10km"
  purpose: "windows-docker-presentation"
source:
  overture_release: "2026-07-22.0"
  root: "${PRESENTATION_BUNDLE_DIR:-/presentation-input}"
  division_area_glob: "theme=divisions/type=division_area/*.parquet"
  segment_glob: "theme=transportation/type=segment/*.parquet"
output:
  root: "${BENCHMARK_DATA_DIR:-/presentation-output}"
  evidence_root: "${BENCHMARK_DATA_DIR:-/presentation-output}/evidence"
boundary:
  mode: "locality_buffer"
  country: "IL"
  subtype: "country"
  require_land: true
  locality_id: "248ef38a-2ef7-4f18-9cf4-71a8f9b1d9ab"
  locality_name_en: "Ashdod"
  buffer_m: 10000
  clip_to_country_land: true
  projected_crs: "EPSG:2039"
roads:
  headline_tier: "general_driving"
  tiers:
    arterial: [motorway, trunk, primary, secondary]
    general_driving: [motorway, trunk, primary, secondary, tertiary, unclassified, residential, living_street]
    service_rural: [motorway, trunk, primary, secondary, tertiary, unclassified, residential, living_street, service, track]
  excluded: [footway, path, steps, pedestrian, cycleway, bridleway, raceway, unknown]
  geoparquet_version: "1.1"
  max_row_group_size: 100000
locations:
  count: 1000
  generator: "numpy.PCG64"
  seed: 20260727
runtime:
  sedonadb_memory_limit: "${SEDONADB_MEMORY_LIMIT:-12gb}"
benchmark:
  warmups: 1
  repetitions: 3
  correctness_tolerance_m: 1.0
  exhaustive_oracle_locations: 100
  kinetica_initial_radius_m: 1000
  kinetica_solution: 1
  high_variability_relative_mad: 0.20
  telemetry_interval_seconds: 0.5
kinetica:
  host: "${KINETICA_HOST:-host.docker.internal}"
  rest_port: "${KINETICA_REST_PORT:-19191}"
  postgres_port: "${KINETICA_POSTGRES_PORT:-15434}"
  database: "ki_home"
  user: "${KINETICA_USER:-admin}"
  password_file: "${KINETICA_PASSWORD_FILE:-/run/secrets/kinetica_password}"
